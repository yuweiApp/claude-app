# 网关功能上的配置，启动时读一次，改完要重启网关。
# 端口、密钥、目录、默认模型这些部署相关的仍在 .env.local（见 src/config.ts）。

# 网关自带的 MCP 工具：内置浏览器 mcp__inapp__…、外部浏览器 mcp__chrome__…、终端 mcp__terminal__…、桌面 mcp__desktop__…
tools:
  # 常驻的工具：第一轮就把完整定义给模型，不藏在 ToolSearch 后面；没列的照旧延迟加载，用到时模型先 ToolSearch。
  # 写工具全名。只对上面这几个服务器生效，
  # 设置页添加的 MCP 服务器和 Claude Code 自带的工具管不到。
  #
  # 常驻越多上下文越大。也不要都不常驻：GPT 类模型常在 ToolSearch 的 select: 里把工具名列了又列，
  # 写满输出上限才停，界面「思考中」两分多钟。
  # 浏览器只剩 browser_run_code（主力，同 Codex 的 js 工具）、browser_snapshot、browser_take_screenshot、browser_tabs，
  # 内置浏览器多一个 browser_keep_tab，两个浏览器全部常驻，工具定义一共约 5000 字符（以前的 Playwright MCP 二十多个工具全部常驻约 5200 token）。
  alwaysLoad:
    - mcp__inapp__browser_run_code
    - mcp__inapp__browser_snapshot
    - mcp__inapp__browser_take_screenshot
    - mcp__inapp__browser_tabs
    - mcp__inapp__browser_keep_tab
    - mcp__chrome__browser_run_code
    - mcp__chrome__browser_snapshot
    - mcp__chrome__browser_take_screenshot
    - mcp__chrome__browser_tabs
    # 桌面操作（下面 desktop.enabled 打开时才有）
    - mcp__desktop__snapshot
    - mcp__desktop__screenshot
    - mcp__desktop__run

# 外部浏览器：模型多一组 mcp__chrome__… 工具，操作用户自己的 Chrome（带着登录状态），见 docs/README.md 第 13 节。
# 要先在 Chrome 里装 Playwright Extension；第一次调用工具时 Chrome 打开扩展的连接页，在里面允许。
# 在 .env.local 里设 PLAYWRIGHT_MCP_EXTENSION_TOKEN（连接页上复制的那一行）就自动连上、不用批准（不会传给模型的子进程），
# PLAYWRIGHT_MCP_PROFILE_DIR_NAME 指定 Chrome 配置（如 "Profile 1"，默认是装了扩展的、最近用过的那个）。
# 默认打开；不需要时改成 false。
externalBrowser:
  enabled: true

# 桌面操作：模型多一组 mcp__desktop__… 工具，经 agent-desktop 读系统的无障碍树、操作网关所在电脑上的原生应用，见 docs/agent-desktop.md。
# 能操作这台电脑上当前登录用户的所有窗口：快照、截图会发给模型接口；网关对外开放（设了 API_TOKEN）时等于让远程的人操作这台电脑的桌面。
# 本应用（桌面版）自己的窗口网关会拦掉。macOS 要给桌面版（或启动网关的终端）「辅助功能」权限，截图还要「屏幕录制」。
# 默认关；要用时改成 true，重启网关。
desktop:
  enabled: true

# 连接器市场（设置页「连接器」→「连接器市场」）：数据来自 MCP 官方注册表，只列有远程地址（HTTP / SSE）的服务器。
# 注册表很大，也有不少批量发布的杂项，所以不搜索时只列下面这些推荐的；搜索时查整个注册表。
# 写注册表里的名称（反向域名，注册表验证过域名或 GitHub 账号的所有权），按这个顺序显示。
connectors:
  registry: https://registry.modelcontextprotocol.io
  featured:
    - com.figma.mcp/mcp
    - com.notion/mcp
    - app.linear/linear
    - io.github.github/github-mcp-server
    - com.atlassian/atlassian-mcp-server
    - io.github.getsentry/sentry-mcp
    - com.canva.mcp/mcp
    - com.vercel/vercel-mcp
    - com.supabase/mcp
    - com.stripe/mcp
    - com.zapier/mcp
    - com.airtable/mcp
    - com.monday/monday.com
    - com.gitlab/mcp
    - net.todoist/mcp
    - com.basecamp/mcp
    - com.webflow/mcp
    - com.neon/mcp
    - io.prisma/mcp
    - com.postman/postman-mcp-server
    - co.huggingface/hf-mcp-server
    - io.github.upstash/context7
    - ai.exa/exa
    - com.apify/apify-mcp-server
    - io.github.firecrawl/firecrawl-mcp-server
    - io.github.grafana/mcp-grafana
    - com.amplitude/mcp-server
    - com.circleci/mcp
    - com.digitalocean/mcp
    - com.paypal.mcp/mcp
    - com.cloudflare.mcp/mcp

# 插件市场（设置页「插件」→「插件市场」）：市场的 git 仓库地址，交给 Claude Code 自己克隆、安装（要有 git），见 docs/README.md「插件市场」。
# 写完整的 https 地址：GitHub 的简写（owner/repo）Claude Code 会用 SSH 克隆，没配 SSH 密钥的电脑会失败。
# Claude Code 另有内置的 anthropic-plugin-directory（三千多个，含合作伙伴的），不在这里列就不显示。
plugins:
  marketplaces:
    - https://github.com/anthropics/claude-plugins-official.git
