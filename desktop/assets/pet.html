<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>灵宠</title>
<!-- 灵宠窗口（desktop/src/pet.ts）：透明背景，右下角一个小精灵，上面是完成通知的气泡。接口见 pet-preload.cts -->
<style>
  :root {
    --bubble-bg: rgba(255, 255, 255, 0.97);
    --bubble-fg: #2b2620;
    --bubble-sub: #857a6d;
    --bubble-border: rgba(80, 60, 30, 0.14);
    --accent: #d9772b;
    --pill-bg: rgba(43, 38, 32, 0.82);
    --pill-fg: #fff7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bubble-bg: rgba(40, 37, 34, 0.97);
      --bubble-fg: #f4ede4;
      --bubble-sub: #b3a796;
      --bubble-border: rgba(255, 240, 220, 0.14);
      --accent: #f0a05a;
      --pill-bg: rgba(250, 244, 236, 0.9);
      --pill-fg: #2b2620;
    }
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: absolute;
    inset: 0;
  }

  /* 气泡：在小精灵上方，靠右，尾巴指向小精灵 */
  .bubble {
    position: absolute;
    right: 18px;
    bottom: 118px;
    max-width: 210px;
    min-width: 120px;
    box-sizing: border-box;
    padding: 9px 26px 9px 12px;
    border-radius: 14px;
    background: var(--bubble-bg);
    color: var(--bubble-fg);
    border: 1px solid var(--bubble-border);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    transform-origin: 80% 100%;
    animation: pop 0.32s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  .bubble[hidden] { display: none; }
  .bubble::after {
    content: "";
    position: absolute;
    right: 46px;
    bottom: -7px;
    width: 12px;
    height: 12px;
    background: var(--bubble-bg);
    border-right: 1px solid var(--bubble-border);
    border-bottom: 1px solid var(--bubble-border);
    transform: rotate(45deg);
  }
  .bubble-title {
    font-weight: 600;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .bubble-title b { color: var(--accent); font-weight: 600; }
  .bubble-sub { color: var(--bubble-sub); font-size: 12px; margin-top: 2px; }
  .bubble-close {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--bubble-sub);
    font-size: 14px;
    line-height: 18px;
    cursor: pointer;
  }
  .bubble-close:hover { background: var(--bubble-border); color: var(--bubble-fg); }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* 小精灵 */
  .pet {
    position: absolute;
    right: 22px;
    bottom: 8px;
    width: 104px;
    height: 104px;
    cursor: grab;
    touch-action: none;
  }
  .pet.dragging { cursor: grabbing; }
  .pet svg { width: 100%; height: 100%; overflow: visible; }
  .float { animation: float 2.8s ease-in-out infinite; transform-origin: 60px 90px; }
  .pet.jump .float { animation: jump 0.9s cubic-bezier(0.3, 0.8, 0.4, 1) 2, float 2.8s ease-in-out 1.8s infinite; }
  .pet.land .float { animation: land 0.4s cubic-bezier(0.25, 0.9, 0.35, 1), float 2.8s ease-in-out 0.4s infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    15% { transform: translateY(2px) scale(1.08, 0.9); }
    45% { transform: translateY(-18px) scale(0.95, 1.06); }
    75% { transform: translateY(0) scale(1.06, 0.94); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes land {
    0% { transform: translateY(-4px) scale(0.96, 1.05); }
    35% { transform: translateY(3px) scale(1.11, 0.88); }
    70% { transform: translateY(-2.5px) scale(0.98, 1.03); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .eyes { animation: blink 4.2s infinite; transform-origin: 60px 66px; }
  @keyframes blink {
    0%, 93%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }
  .happy { display: none; }
  .pet.happy-face .eyes { display: none; }
  .pet.happy-face .happy { display: inline; }
  .glow { animation: glow 2.8s ease-in-out infinite; transform-origin: 60px 68px; }
  @keyframes glow {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.06); }
  }
  .tail { animation: wag 2.2s ease-in-out infinite; transform-origin: 88px 86px; }
  @keyframes wag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-10deg); }
  }

  /* 干活中：眼睛左右看，身边转着三颗星光 */
  .sparks { display: none; transform-origin: 60px 66px; }
  .pet.working .sparks { display: inline; animation: orbit 2.4s linear infinite; }
  .pet.working .pupils { animation: look 3s ease-in-out infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes look {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-2.5px); }
    70% { transform: translateX(2.5px); }
  }

  /* 干活中的小标签 */
  .pill {
    position: absolute;
    right: 18px;
    bottom: 112px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--pill-fg);
    font-size: 12px;
    white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
  }
  .pill[hidden] { display: none; }
  /*
   * 悬停卡片打开时藏起来，但不用 hidden：元素消失、再出现在鼠标底下会触发 pointerleave / pointerenter，卡片跟着收起、弹出。
   * 也不接鼠标：它在卡片窗口底下，接了的话灵宠窗口和卡片窗口来回抢鼠标（见 pet.ts 的 showPeek），还会挡住卡片上的「打开会话」
   */
  .pill.peeking { opacity: 0; pointer-events: none; }
  /* 省略号一个个冒出来：占位的 "..." 是透明的，宽度不变，标签不会跟着伸缩跳动 */
  .dots { position: relative; color: transparent; }
  .dots::after { content: ""; position: absolute; left: 0; color: var(--pill-fg); animation: dots 1.4s steps(4) infinite; }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  /* 没事时睡觉：闭眼、慢慢呼吸、头上冒 Z */
  .sleepy, .sleep-mouth, .zzz { display: none; }
  .pet.sleeping .eyes, .pet.sleeping .mouth { display: none; }
  .pet.sleeping .sleepy, .pet.sleeping .sleep-mouth, .pet.sleeping .zzz { display: inline; }
  .pet.sleeping .float { animation: breathe 3.6s ease-in-out infinite; }
  .pet.sleeping.jump .float { animation: jump 0.9s cubic-bezier(0.3, 0.8, 0.4, 1) 2, breathe 3.6s ease-in-out 1.8s infinite; }
  .pet.sleeping .glow { animation: glow-dim 3.6s ease-in-out infinite; }
  .pet.sleeping .tail { animation: wag 6s ease-in-out infinite; }
  .sleep-mouth { animation: snore 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .zzz text { opacity: 0; animation: zzz 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; paint-order: stroke; }
  .zzz text:nth-child(2) { animation-delay: 1.2s; }
  .zzz text:nth-child(3) { animation-delay: 2.4s; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50% { transform: translateY(1px) scale(1.035, 0.965); }
  }
  @keyframes glow-dim {
    0%, 100% { opacity: 0.3; transform: scale(0.97); }
    50% { opacity: 0.45; transform: scale(1.02); }
  }
  @keyframes snore {
    0%, 100% { transform: scale(0.7); }
    50% { transform: scale(1.15); }
  }
  @keyframes zzz {
    0% { opacity: 0; transform: translate(0, 0) scale(0.5) rotate(-8deg); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(16px, -30px) scale(1.25) rotate(12deg); }
  }

  /* 拖动动效（委屈挣扎 > < + 御风拖尾）：飞机耳、小汗滴、高频微颤乱蹬，拖动方向身后飘出风痕与灵光星点 */
  .drag-face, .drag-sweat, .drag-wind { display: none; }
  .drag-body { transform-origin: 60px 68px; }
  .pet.dragging .float { animation: drag-shake 0.24s ease-in-out infinite; transform-origin: 60px 68px; }
  .pet.dragging .drag-body { transform: rotate(var(--drag-tilt, 0deg)) scale(1.04, 0.96); }
  .pet.dragging .eyes, .pet.dragging .happy, .pet.dragging .sleepy,
  .pet.dragging .mouth, .pet.dragging .sleep-mouth, .pet.dragging .zzz, .pet.dragging .sparks { display: none; }
  .pet.dragging .drag-face { display: inline; }
  .pet.dragging .drag-sweat { display: inline; animation: drag-sweat 0.7s ease-in-out infinite; transform-origin: 90px 44px; }
  .pet.dragging .drag-wind { display: inline; opacity: var(--drag-wind, 0.65); }
  .pet.dragging .drag-wind-dir { transform: scaleX(var(--drag-dir, 1)); transform-origin: 60px 68px; }
  .pet.dragging .wind-streak-1 { animation: wind-streak 0.52s linear infinite; }
  .pet.dragging .wind-streak-2 { animation: wind-streak 0.52s linear 0.17s infinite; }
  .pet.dragging .wind-streak-3 { animation: wind-streak 0.52s linear 0.34s infinite; }
  .pet.dragging .blush { opacity: 0.85; }
  .pet.dragging .glow { animation: none; opacity: 0.85; transform: scale(1.08); }
  .pet.dragging .ear-left { animation: drag-ear-l 0.2s ease-in-out infinite; transform-origin: 41px 44px; }
  .pet.dragging .ear-right { animation: drag-ear-r 0.2s ease-in-out infinite; transform-origin: 79px 44px; }
  .pet.dragging .paw-left { animation: drag-paw-l 0.18s ease-in-out infinite; transform-origin: 48px 97px; }
  .pet.dragging .paw-right { animation: drag-paw-r 0.18s ease-in-out infinite; transform-origin: 72px 97px; }
  .pet.dragging .tail { animation: drag-wag 0.22s ease-in-out infinite; }
  @keyframes drag-shake {
    0%, 100% { transform: translate(0, -2px) rotate(-3deg); }
    50% { transform: translate(0, -4px) rotate(3deg); }
  }
  @keyframes drag-ear-l {
    0%, 100% { transform: rotate(-20deg) translate(-2px, 3px); }
    50% { transform: rotate(-27deg) translate(-2px, 4px); }
  }
  @keyframes drag-ear-r {
    0%, 100% { transform: rotate(20deg) translate(2px, 3px); }
    50% { transform: rotate(27deg) translate(2px, 4px); }
  }
  @keyframes drag-paw-l {
    0%, 100% { transform: translate(-2px, -3px) rotate(22deg); }
    50% { transform: translate(2px, 2px) rotate(-18deg); }
  }
  @keyframes drag-paw-r {
    0%, 100% { transform: translate(2px, 2px) rotate(18deg); }
    50% { transform: translate(-2px, -3px) rotate(-22deg); }
  }
  @keyframes drag-wag {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(-18deg); }
  }
  @keyframes drag-sweat {
    0%, 100% { transform: translateY(0) scale(0.95); opacity: 0.95; }
    50% { transform: translateY(3px) scale(1.08); opacity: 0.65; }
  }
  @keyframes wind-streak {
    0% { opacity: 0; transform: translateX(6px) scaleX(0.55); }
    30% { opacity: 0.92; }
    100% { opacity: 0; transform: translateX(-16px) scaleX(1.1); }
  }

  /* 跳舞时的侧面：外壳（pet.ts）在线上一帧帧挪窗口，这里换成侧面，蹦着走、到头翻跟头。默认朝右，朝左时镜像 */
  .side, .side-happy { display: none; }
  .pet.dancing .float, .pet.dancing .sparks, .pet.dancing .zzz { display: none; }
  .pet.dancing .side { display: inline; }
  .pet.flip .side-eye { display: none; }
  .pet.flip .side-happy { display: inline; }
  .pet.face-left .side-flip { transform: scale(-1, 1); transform-origin: 60px 60px; }
  .pet.walk .side-move { animation: hop 0.6s ease-in-out infinite; transform-origin: 60px 103px; }
  .pet.flip .side-move { animation: flip 0.7s cubic-bezier(0.3, 0.8, 0.4, 1); transform-origin: 60px 68px; }
  .pet.walk .side-tail { animation: side-wag 0.6s ease-in-out infinite; transform-origin: 34px 81px; }
  .pet.walk .side-paw-near { animation: paw-near 0.6s ease-in-out infinite; transform-origin: 52px 99px; }
  .pet.walk .side-paw-far { animation: paw-far 0.6s ease-in-out infinite; transform-origin: 72px 99px; }
  .pet.walk .side-ear-near { animation: ear-bob 0.6s ease-in-out infinite; transform-origin: 45px 43px; }
  .pet.walk .side-ear-far { animation: ear-bob 0.6s ease-in-out infinite; transform-origin: 73px 40px; }
  @keyframes hop {
    0%, 50%, 100% { transform: translateY(0) scale(1.03, 0.97) rotate(0deg); }
    25% { transform: translateY(-7px) scale(0.97, 1.03) rotate(4deg); }
    75% { transform: translateY(-7px) scale(0.97, 1.03) rotate(-2deg); }
  }
  @keyframes flip {
    0% { transform: translateY(0) scale(1, 1) rotate(0deg); }
    20% { transform: translateY(3px) scale(1.08, 0.9) rotate(0deg); }
    60% { transform: translateY(-24px) scale(1, 1) rotate(200deg); }
    100% { transform: translateY(0) scale(1, 1) rotate(360deg); }
  }
  @keyframes side-wag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-12deg); }
  }
  @keyframes paw-near {
    0%, 50%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-4px, -1px) rotate(10deg); }
    75% { transform: translate(5px, -2px) rotate(-10deg); }
  }
  @keyframes paw-far {
    0%, 50%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(4px, -2px) rotate(-10deg); }
    75% { transform: translate(-5px, -1px) rotate(10deg); }
  }
  @keyframes ear-bob {
    0%, 50%, 100% { transform: rotate(0deg); }
    25%, 75% { transform: rotate(-3.5deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pet.walk .side-move, .pet.flip .side-move, .pet.walk .side-tail,
    .pet.walk .side-paw-near, .pet.walk .side-paw-far, .pet.walk .side-ear-near, .pet.walk .side-ear-far,
    .pet.dragging .float, .pet.dragging .tail, .pet.dragging .ear-left, .pet.dragging .ear-right,
    .pet.dragging .paw-left, .pet.dragging .paw-right, .pet.dragging .drag-sweat,
    .pet.dragging .wind-streak-1, .pet.dragging .wind-streak-2, .pet.dragging .wind-streak-3,
    .pet.land .float { animation: none; }
    .pet.dragging .drag-wind { display: none; }
    .float, .glow, .tail, .eyes, .pet.working .sparks, .pet.working .pupils, .pet.jump .float, .dots::after,
    .pet.sleeping .float, .pet.sleeping .glow, .pet.sleeping .tail, .sleep-mouth, .zzz text { animation: none; }
    .dots { color: inherit; }
    .zzz text { opacity: 0.85; }
    .zzz text:nth-child(2) { transform: translate(8px, -14px); }
    .zzz text:nth-child(3) { transform: translate(16px, -28px); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bubble hit" id="bubble" hidden title="点击打开会话">
    <div class="bubble-title" id="bubble-title"></div>
    <div class="bubble-sub" id="bubble-sub"></div>
    <button class="bubble-close" id="bubble-close" title="知道了" aria-label="知道了">×</button>
  </div>
  <div class="pill hit" id="pill" hidden><span id="pill-text"></span><span class="dots" aria-hidden="true">...</span></div>

  <div class="pet hit" id="pet">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="g-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffd49a" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#ffd49a" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff6e8" />
          <stop offset="100%" stop-color="#ffd2a6" />
        </linearGradient>
        <linearGradient id="g-tail" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd2a6" />
          <stop offset="100%" stop-color="#fff6e8" />
        </linearGradient>
        <linearGradient id="g-tail-side" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd2a6" />
          <stop offset="100%" stop-color="#fff6e8" />
        </linearGradient>
        <linearGradient id="g-ear-near" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff1df" />
          <stop offset="100%" stop-color="#fff2e1" />
        </linearGradient>
      </defs>
      <circle class="glow" cx="60" cy="68" r="50" fill="url(#g-glow)" />
      <!-- 拖动时的风痕与灵光拖尾（随拖动方向左右翻转） -->
      <g class="drag-wind">
        <g class="drag-wind-dir">
          <path class="wind-streak-1" d="M22 44 q-9 0 -16 2" fill="none" stroke="#8ad8ce" stroke-width="2" stroke-linecap="round" />
          <path class="wind-streak-2" d="M20 68 q-10 0 -18 0" fill="none" stroke="#ffd49a" stroke-width="2.2" stroke-linecap="round" />
          <path class="wind-streak-3" d="M24 90 q-9 0 -15 -2" fill="none" stroke="#8ad8ce" stroke-width="1.8" stroke-linecap="round" />
          <path class="wind-streak-2" d="M12 52 l1.5 3.3 3.3 1.5 -3.3 1.5 -1.5 3.3 -1.5 -3.3 -3.3 -1.5 3.3 -1.5z" fill="#ffc35c" />
          <path class="wind-streak-3" d="M14 76 l1.1 2.4 2.4 1.1 -2.4 1.1 -1.1 2.4 -1.1 -2.4 -2.4 -1.1 2.4 -1.1z" fill="#8ad8ce" />
        </g>
      </g>
      <g class="float">
        <g class="drag-body">
          <!-- 尾巴：一缕云气 -->
          <path class="tail" d="M86 84c14 2 22-6 22-16 0-6-4-10-9-9 3 3 3 8-1 11-4 3-9 3-14 2z" fill="url(#g-tail)" stroke="#e9a86d" stroke-width="1.5" stroke-linejoin="round" />
          <!-- 耳朵 -->
          <g class="ear-left">
            <path d="M30 50 L28 22 Q29 18 33 21 L52 38 Z" fill="#fff1df" stroke="#e9a86d" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M34 44 L33 28 L46 39 Z" fill="#ffb9a8" />
          </g>
          <g class="ear-right">
            <path d="M90 50 L92 22 Q91 18 87 21 L68 38 Z" fill="#fff1df" stroke="#e9a86d" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M86 44 L87 28 L74 39 Z" fill="#ffb9a8" />
          </g>
          <!-- 身体 -->
          <ellipse cx="60" cy="68" rx="37" ry="33" fill="url(#g-body)" stroke="#e9a86d" stroke-width="1.5" />
          <!-- 额头的灵纹 -->
          <path d="M60 41 l3 5 -3 5 -3 -5z" fill="#5fc1b5" />
          <!-- 眼睛 -->
          <g class="eyes">
            <g class="pupils">
              <ellipse cx="47" cy="66" rx="4.6" ry="5.6" fill="#3a2e25" />
              <ellipse cx="73" cy="66" rx="4.6" ry="5.6" fill="#3a2e25" />
              <circle cx="48.6" cy="63.8" r="1.6" fill="#fff" />
              <circle cx="74.6" cy="63.8" r="1.6" fill="#fff" />
            </g>
          </g>
          <g class="happy" fill="none" stroke="#3a2e25" stroke-width="2.6" stroke-linecap="round">
            <path d="M42 68 q5 -7 10 0" />
            <path d="M68 68 q5 -7 10 0" />
          </g>
          <!-- 睡着时闭着的眼睛 -->
          <g class="sleepy" fill="none" stroke="#3a2e25" stroke-width="2.4" stroke-linecap="round">
            <path d="M42 66 q5 4.5 10 0" />
            <path d="M68 66 q5 4.5 10 0" />
          </g>
          <!-- 拖动时的委屈 > < 眼、波浪嘴与小汗滴 -->
          <g class="drag-face" fill="none" stroke="#3a2e25" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M42 62 l7 4 -7 4" />
            <path d="M78 62 l-7 4 7 4" />
            <path d="M54 77 q2 -2.4 4 0 t4 0 t4 0" stroke-width="1.8" />
          </g>
          <path class="drag-sweat" d="M90 36 C90 36 95 43 95 46.5 A5 5 0 0 1 85 46.5 C85 43 90 36 90 36 Z" fill="#8fd3ff" stroke="#5aa9e6" stroke-width="1.2" />
          <!-- 腮红和嘴 -->
          <ellipse class="blush" cx="38" cy="76" rx="5.5" ry="3.2" fill="#ff9e8a" opacity="0.55" />
          <ellipse class="blush" cx="82" cy="76" rx="5.5" ry="3.2" fill="#ff9e8a" opacity="0.55" />
          <path class="mouth" d="M55 76 q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke="#3a2e25" stroke-width="1.8" stroke-linecap="round" />
          <ellipse class="sleep-mouth" cx="60" cy="78" rx="2" ry="2.4" fill="#c96f5c" />
          <!-- 小爪子 -->
          <ellipse class="paw-left" cx="48" cy="99" rx="7" ry="4" fill="#fff1df" stroke="#e9a86d" stroke-width="1.5" />
          <ellipse class="paw-right" cx="72" cy="99" rx="7" ry="4" fill="#fff1df" stroke="#e9a86d" stroke-width="1.5" />
        </g>
      </g>
      <!-- 侧面（跳舞时）：朝右，与正面同款圆润团子身形，爪子底边和正面一样在 y 103 -->
      <g class="side">
        <g class="side-flip">
          <g class="side-move">
            <!-- 尾巴：一缕云气 -->
            <path class="side-tail" d="M35 83 C20 85 11 77 11 66 C11 60 15 56 20 57 C17 60 17 65 21 68 C25 71 30 71 36 70 Z" fill="url(#g-tail-side)" stroke="#e9a86d" stroke-width="1.5" stroke-linejoin="round" />
            <!-- 后面那只耳朵 -->
            <path class="side-ear-far" d="M62 41 L71 19 Q73.5 16 76 20 L85 43 Z" fill="#ffe8d0" stroke="#e9a86d" stroke-width="1.5" stroke-linejoin="round" />
            <!-- 后面那只小爪子 -->
            <ellipse class="side-paw-far" cx="72" cy="99" rx="7" ry="4" fill="#ffe8d0" stroke="#e9a86d" stroke-width="1.5" />
            <!-- 圆润侧身身体 -->
            <path d="M61 35 C79 35 92 47 94.5 64 C96 76 90.5 88.5 79 95 C69 99.5 49 99.5 38 95 C26.5 89.5 23.5 79.5 25 68 C27 50 42 35 61 35 Z" fill="url(#g-body)" stroke="#e9a86d" stroke-width="1.5" stroke-linejoin="round" />
            <!-- 前面那只耳朵（底部无缝融入头部，无生硬封边） -->
            <g class="side-ear-near">
              <path d="M41 46 L44 20 Q46 16.5 49.5 19.5 L62 42 Q51 48 41 46 Z" fill="url(#g-ear-near)" />
              <path d="M41 46 L44 20 Q46 16.5 49.5 19.5 L62 42" fill="none" stroke="#e9a86d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M45.5 42 L47.5 25.5 Q48.5 24 50 25.5 L57.5 40.5 Q51 43 45.5 42 Z" fill="#ffb9a8" />
            </g>
            <!-- 额头的灵纹（顺着额头弧度微倾） -->
            <path d="M79.5 43 l2.2 4.5 -2.2 4.5 -2.2 -4.5 z" fill="#5fc1b5" transform="rotate(20 79.5 47.5)" />
            <!-- 眼睛、翻跟头时的开心眼、腮红和嘴 -->
            <g class="side-eye">
              <ellipse cx="81" cy="65" rx="4.3" ry="5.5" fill="#3a2e25" />
              <circle cx="82.5" cy="62.8" r="1.6" fill="#fff" />
            </g>
            <path class="side-happy" d="M76.5 66.5 q4.5 -6.5 9 0" fill="none" stroke="#3a2e25" stroke-width="2.5" stroke-linecap="round" />
            <ellipse cx="74.5" cy="75" rx="5.2" ry="3" fill="#ff9e8a" opacity="0.55" />
            <path d="M86 74 q2.5 2.8 5 -0.2" fill="none" stroke="#3a2e25" stroke-width="1.7" stroke-linecap="round" />
            <!-- 前面那只小爪子 -->
            <ellipse class="side-paw-near" cx="52" cy="99" rx="7" ry="4" fill="#fff1df" stroke="#e9a86d" stroke-width="1.5" />
          </g>
        </g>
      </g>
      <!-- 睡着时头上冒的 Z -->
      <g class="zzz" fill="#8eaaf0" stroke="#fff6e8" stroke-width="2" stroke-linejoin="round" font-family="system-ui, sans-serif" font-weight="800" font-size="15">
        <text x="88" y="38">z</text>
        <text x="88" y="38">z</text>
        <text x="88" y="38">Z</text>
      </g>
      <!-- 干活时绕着转的星光 -->
      <g class="sparks" fill="#ffc35c">
        <path d="M60 12 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" />
        <path d="M108 80 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5z" />
        <path d="M14 84 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5z" />
      </g>
    </svg>
  </div>
</div>
<script>
  const api = window.pet;
  const $ = (id) => document.getElementById(id);
  const petEl = $("pet");
  const bubble = $("bubble");
  const pill = $("pill");
  let current = { working: 0, notices: [] };
  let dragging = false;
  let peeking = false;
  /** 睡着时被点了一下：醒一会儿再接着睡 */
  let awakeUntil = 0;
  let sleepTimer = 0;

  function render(state) {
    current = state;
    const notices = state.notices || [];
    petEl.classList.toggle("working", state.working > 0 && notices.length === 0);
    petEl.classList.toggle("happy-face", notices.length > 0);
    petEl.classList.toggle("sleeping", state.working === 0 && notices.length === 0 && Date.now() >= awakeUntil);
    if (notices.length) {
      const first = notices[0];
      const title = $("bubble-title");
      title.textContent = "";
      title.append("「");
      const name = document.createElement("b");
      name.textContent = first.title;
      title.append(name, "」完成啦！");
      $("bubble-sub").textContent =
        notices.length > 1 ? `还有 ${notices.length - 1} 个会话也好了，点我看看` : state.working > 0 ? `还有 ${state.working} 个会话在跑，点我看看` : "点我看看";
      bubble.hidden = false;
      pill.hidden = true;
    } else {
      bubble.hidden = true;
      pill.hidden = !(state.working > 0);
      pill.classList.toggle("peeking", peeking);
      $("pill-text").textContent = `${state.working} 个会话在跑`;
    }
  }

  function wake() {
    awakeUntil = Date.now() + 4000;
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(() => render(current), 4000);
    render(current);
  }

  function land() {
    if (reducedMotion.matches) return;
    petEl.classList.remove("land");
    void petEl.getBoundingClientRect();
    petEl.classList.add("land");
  }

  function jump() {
    if (petEl.classList.contains("sleeping")) wake();
    petEl.classList.remove("jump", "land");
    // 重新触发动画
    void petEl.getBoundingClientRect();
    petEl.classList.add("jump");
  }
  petEl.addEventListener("animationend", (e) => {
    if (e.animationName === "jump" && e.elapsedTime > 1.7) petEl.classList.remove("jump");
    if (e.animationName === "land") petEl.classList.remove("land");
  });

  // 跳舞时外壳让换姿势：侧面朝哪边、蹦着走还是翻跟头；回到正面时 facing 是 null
  api.onPose((pose) => {
    const facing = pose && (pose.facing === "left" || pose.facing === "right") ? pose.facing : null;
    const wasDancing = petEl.classList.contains("dancing");
    if (facing || wasDancing) wake();
    if (facing) petEl.classList.remove("land");
    petEl.classList.toggle("dancing", !!facing);
    petEl.classList.toggle("face-left", facing === "left");
    petEl.classList.toggle("walk", !!facing && pose.motion === "walk");
    petEl.classList.remove("flip");
    if (facing && pose.motion === "flip") {
      void petEl.getBoundingClientRect();
      petEl.classList.add("flip");
    }
  });

  api.onState(render);
  api.onDone(jump);
  api.onPeeking((active) => {
    peeking = !!active;
    render(current);
  });
  void api.state().then((s) => s && render(s));

  // 透明的地方鼠标穿过去，移到小精灵、气泡上时接住
  for (const el of document.querySelectorAll(".hit")) {
    el.addEventListener("pointerenter", () => api.hover(true));
    el.addEventListener("pointerleave", () => !dragging && api.hover(false));
  }
  // 鼠标移到小精灵（或「会话在跑」小胶囊）上时，通知外壳弹出正在运行任务的实时回复卡片
  for (const el of [petEl, pill]) {
    el.addEventListener("pointerenter", () => !dragging && api.peek("pet", true));
    el.addEventListener("pointerleave", () => api.peek("pet", false));
  }

  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    if (e.target.closest(".hit")) api.menu();
  });

  bubble.addEventListener("click", (e) => {
    if (e.target.closest("#bubble-close")) return;
    api.open(current.notices[0]?.sessionId);
  });
  $("bubble-close").addEventListener("click", () => {
    api.dismiss();
    api.hover(false);
  });

  // 按住拖动，没怎么动就当点击：单击跳一下，双击回到主窗口
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const DOUBLE_MS = 400;
  let lastClick = 0;
  let start = null;
  /** 按下时鼠标在窗口里的位置：拖动时窗口左上角 = 鼠标的屏幕位置减去它，窗口卡在屏幕边上时松开再拖也不会错位 */
  let grab = null;
  /** 拖动动效状态：按鼠标移动速度和方向驱动轻微惯性倾角与御风拖尾方向/显隐 */
  let lastDragPos = null;
  let dragDx = 0;
  let dragDy = 0;
  let dragRaf = 0;
  let dragLastTick = 0;
  let dragTilt = 0;
  let dragDir = 1;
  let dragWind = 0.35;

  function startDragMotion() {
    if (reducedMotion.matches || dragRaf) return;
    dragLastTick = performance.now();
    const step = (now) => {
      if (!dragging) {
        dragRaf = 0;
        return;
      }
      const dt = Math.min(0.05, Math.max(0.004, (now - dragLastTick) / 1000));
      dragLastTick = now;
      const vx = dragDx / (dt * 60);
      const vy = dragDy / (dt * 60);
      dragDx = 0;
      dragDy = 0;

      if (Math.abs(vx) > 0.4) dragDir = vx > 0 ? 1 : -1;
      const lerp = 1 - Math.exp(-14 * dt);
      const targetTilt = Math.max(-12, Math.min(12, vx * 0.75));
      dragTilt += (targetTilt - dragTilt) * lerp;
      const speed = Math.min(1, Math.hypot(vx, vy) / 14);
      const targetWind = 0.32 + speed * 0.68;
      dragWind += (targetWind - dragWind) * (1 - Math.exp(-10 * dt));

      petEl.style.setProperty("--drag-tilt", `${dragTilt.toFixed(2)}deg`);
      petEl.style.setProperty("--drag-dir", String(dragDir));
      petEl.style.setProperty("--drag-wind", dragWind.toFixed(2));
      dragRaf = requestAnimationFrame(step);
    };
    dragRaf = requestAnimationFrame(step);
  }

  function stopDragMotion() {
    if (dragRaf) cancelAnimationFrame(dragRaf);
    dragRaf = 0;
    lastDragPos = null;
    dragDx = dragDy = dragTilt = 0;
    dragWind = 0.35;
    petEl.style.removeProperty("--drag-tilt");
    petEl.style.removeProperty("--drag-dir");
    petEl.style.removeProperty("--drag-wind");
  }

  petEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    petEl.setPointerCapture(e.pointerId);
    start = { x: e.screenX, y: e.screenY };
    grab = { x: e.clientX, y: e.clientY };
    dragging = false;
  });
  petEl.addEventListener("pointermove", (e) => {
    if (!start) return;
    if (!dragging && Math.hypot(e.screenX - start.x, e.screenY - start.y) > 4) {
      dragging = true;
      lastDragPos = { x: e.screenX, y: e.screenY };
      if (Math.abs(e.screenX - start.x) > 1) dragDir = e.screenX > start.x ? 1 : -1;
      petEl.classList.remove("land", "jump");
      petEl.classList.add("dragging");
      wake();
      startDragMotion();
      api.drag(true);
    }
    if (!dragging) return;
    if (lastDragPos) {
      dragDx += e.screenX - lastDragPos.x;
      dragDy += e.screenY - lastDragPos.y;
      lastDragPos = { x: e.screenX, y: e.screenY };
    }
    api.move(e.screenX - grab.x, e.screenY - grab.y);
  });
  const end = (e, cancelled) => {
    if (!start) return;
    const wasDrag = dragging;
    start = grab = null;
    dragging = false;
    petEl.classList.remove("dragging");
    stopDragMotion();
    if (wasDrag) {
      wake();
      land();
      api.drag(false);
    }
    if (wasDrag || cancelled) return;
    const now = Date.now();
    if (now - lastClick < DOUBLE_MS) {
      lastClick = 0;
      api.open(current.notices[0]?.sessionId);
    } else {
      lastClick = now;
      jump();
    }
  };
  petEl.addEventListener("pointerup", (e) => end(e, false));
  petEl.addEventListener("pointercancel", (e) => end(e, true));
</script>
</body>
</html>
