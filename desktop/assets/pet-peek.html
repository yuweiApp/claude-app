<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>灵宠实时回复</title>
<!-- 灵宠悬停时显示的暖纸标签卡片（desktop/src/pet.ts）：展示正在运行的多个任务的最新回复，点击跳转对应会话 -->
<style>
  :root {
    --card-bg: #fffcf7;
    --card-fg: #2b2620;
    --card-sub: #7a6d5e;
    --card-border: rgba(140, 102, 58, 0.22);
    --card-shadow: 0 10px 28px rgba(40, 26, 10, 0.2);
    --divider: rgba(140, 102, 58, 0.14);
    --tab-bg: rgba(140, 102, 58, 0.08);
    --tab-fg: #7a6d5e;
    --tab-active-bg: #fff0dc;
    --tab-active-fg: #b45a16;
    --tab-active-border: rgba(217, 119, 43, 0.36);
    --accent: #d9772b;
    --scroll: rgba(140, 102, 58, 0.26);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card-bg: #272320;
      --card-fg: #f4ede4;
      --card-sub: #b5a898;
      --card-border: rgba(255, 224, 188, 0.16);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
      --divider: rgba(255, 240, 220, 0.1);
      --tab-bg: rgba(255, 240, 220, 0.07);
      --tab-fg: #b5a898;
      --tab-active-bg: rgba(240, 160, 90, 0.18);
      --tab-active-fg: #f5b473;
      --tab-active-border: rgba(240, 160, 90, 0.36);
      --accent: #f0a05a;
      --scroll: rgba(255, 232, 204, 0.22);
    }
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font: 12px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--card-fg);
  }
  .wrap {
    position: absolute;
    inset: 0;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .wrap.below { justify-content: flex-start; }

  .card {
    position: relative;
    width: 332px;
    box-sizing: border-box;
    padding: 11px 12px 10px;
    border-radius: 16px;
    background: var(--card-bg);
    color: var(--card-fg);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    animation: pop 0.18s cubic-bezier(0.2, 1.3, 0.4, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card::after {
    content: "";
    position: absolute;
    left: calc(var(--arrow-x, 286px) - 6px);
    bottom: -6px;
    width: 11px;
    height: 11px;
    background: var(--card-bg);
    border-right: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    transform: rotate(45deg);
  }
  .wrap.below .card::after {
    bottom: auto;
    top: -6px;
    border-right: none;
    border-bottom: none;
    border-left: 1px solid var(--card-border);
    border-top: 1px solid var(--card-border);
  }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
  }
  .tabs {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 2px;
    min-width: 0;
    flex: 1;
  }
  .tabs::-webkit-scrollbar { height: 3px; }
  .tabs::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
  .tab {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--tab-bg);
    color: var(--tab-fg);
    font: inherit;
    font-size: 12px;
    line-height: 1.35;
    cursor: pointer;
    max-width: 128px;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .tab:hover { filter: brightness(0.97); }
  .tab.active {
    background: var(--tab-active-bg);
    color: var(--tab-active-fg);
    border-color: var(--tab-active-border);
    font-weight: 600;
  }
  .tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    flex-shrink: 0;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.78); }
  }
  .count {
    font-size: 11.5px;
    color: var(--card-sub);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
    color: var(--card-sub);
    margin-bottom: 6px;
  }
  .activity {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .elapsed {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .body {
    font-size: 12.5px;
    line-height: 1.58;
    min-height: 76px;
    max-height: 108px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
    padding-right: 3px;
  }
  .body::-webkit-scrollbar { width: 4px; }
  .body::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  .body.empty { color: var(--card-sub); }
  .caret {
    display: inline-block;
    width: 2px;
    height: 12px;
    vertical-align: -2px;
    margin-left: 2px;
    border-radius: 1px;
    background: var(--accent);
    animation: blink 0.9s steps(2) infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .foot {
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid var(--divider);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
  }
  .foot-title {
    color: var(--card-sub);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .open-btn {
    border: none;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    padding: 1px 2px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .open-btn:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .card, .dot, .caret { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="card" id="card" hidden>
    <div class="head">
      <div class="tabs" id="tabs"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="meta">
      <span class="activity" id="activity"></span>
      <span class="elapsed" id="elapsed"></span>
    </div>
    <div class="body" id="body"></div>
    <div class="foot">
      <span class="foot-title" id="foot-title"></span>
      <button class="open-btn" id="open-btn" type="button">打开会话 →</button>
    </div>
  </div>
</div>
<script>
  const api = window.pet;
  const $ = (id) => document.getElementById(id);
  const COLORS = ["#e07b2a", "#3aa89b", "#7c6ef6", "#d46a8c", "#4d93e0"];
  const wrapEl = $("wrap");
  const cardEl = $("card");
  const tabsEl = $("tabs");
  const bodyEl = $("body");

  let tasks = [];
  let selectedId = null;

  function formatElapsed(startedAt) {
    if (!startedAt) return "";
    const sec = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
    if (sec < 60) return `${sec}s`;
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}m${s < 10 ? "0" : ""}${s}s`;
  }

  function render() {
    if (!tasks.length) {
      cardEl.hidden = true;
      return;
    }
    cardEl.hidden = false;
    if (!selectedId || !tasks.some((t) => t.id === selectedId)) selectedId = tasks[0].id;
    const active = tasks.find((t) => t.id === selectedId) || tasks[0];

    tabsEl.textContent = "";
    tasks.forEach((t, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `tab${t.id === active.id ? " active" : ""}`;
      btn.title = t.title;
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = COLORS[i % COLORS.length];
      const label = document.createElement("span");
      label.className = "tab-label";
      label.textContent = t.title;
      btn.append(dot, label);
      btn.addEventListener("click", () => {
        selectedId = t.id;
        render();
        bodyEl.scrollTop = bodyEl.scrollHeight;
      });
      tabsEl.append(btn);
    });

    $("count").textContent = `${tasks.length} 个`;
    $("activity").textContent = `⚙ ${active.activity || "正在处理"}`;
    $("elapsed").textContent = formatElapsed(active.startedAt);
    $("foot-title").textContent = `「${active.title}」`;

    const atBottom = bodyEl.scrollHeight - bodyEl.scrollTop - bodyEl.clientHeight < 20;
    bodyEl.textContent = "";
    if (active.text) {
      bodyEl.classList.remove("empty");
      bodyEl.append(document.createTextNode(active.text));
      const caret = document.createElement("span");
      caret.className = "caret";
      bodyEl.append(caret);
    } else {
      bodyEl.classList.add("empty");
      bodyEl.append(document.createTextNode(`${active.activity || "正在思考"}，等待回复中…`));
    }
    if (atBottom) bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  function applyPayload(payload) {
    if (!payload) return;
    if (typeof payload.arrowX === "number") cardEl.style.setProperty("--arrow-x", `${payload.arrowX}px`);
    if (payload.placement) wrapEl.classList.toggle("below", payload.placement === "bottom");
    if (Array.isArray(payload.tasks)) {
      tasks = payload.tasks;
      render();
    }
  }

  api.onLive(applyPayload);
  void api.live().then(applyPayload);

  setInterval(() => {
    if (!tasks.length || cardEl.hidden) return;
    const active = tasks.find((t) => t.id === selectedId) || tasks[0];
    if (active) $("elapsed").textContent = formatElapsed(active.startedAt);
  }, 1000);

  $("open-btn").addEventListener("click", () => {
    const active = tasks.find((t) => t.id === selectedId) || tasks[0];
    if (active) api.open(active.id);
  });

  cardEl.addEventListener("pointerenter", () => api.peek("card", true));
  cardEl.addEventListener("pointerleave", () => api.peek("card", false));
</script>
</body>
</html>
